[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scanlan-validation"
version = "0.1.0"
description = "Backend-neutral camera, scale, depth, free-space, and geometry validation for ScanLan"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
scanlan-release-matrix = "scanlan_validation.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scanlan_validation*"]

[tool.setuptools.package-data]
scanlan_validation = ["backend-benchmarks.json", "release-matrix-requirements.json"]
