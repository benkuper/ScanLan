[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scanlan-validation"
version = "0.1.0"
description = "Backend-neutral camera, scale, depth, free-space, and geometry validation for ScanLan"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scanlan_validation*"]
