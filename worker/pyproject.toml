[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scanlan-worker"
version = "0.1.0"
description = "Realtime and production RGB-D reconstruction engine for ScanLan"
license = "GPL-3.0-only"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "Pillow>=10.4,<12"]

[project.urls]
Repository = "https://github.com/benkuper/ScanLan"

[project.optional-dependencies]
reconstruction = ["open3d>=0.19,<0.20"]
build = ["pyinstaller>=6.0"]

[project.scripts]
scanlan-worker = "scanlan.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scanlan*"]
