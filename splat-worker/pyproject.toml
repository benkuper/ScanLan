[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scanlan-splat"
version = "0.1.0"
description = "Isolated depth-aware Gaussian-splat runtime for ScanLan"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.4",
  "Pillow==11.1.0",
  "torch==2.12.0",
  "gsplat==1.5.3",
]

[project.optional-dependencies]
build = ["pyinstaller==6.16.0"]

[project.scripts]
scanlan-splat = "scanlan_splat.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scanlan_splat*"]
